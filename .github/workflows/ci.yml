name: CI

on:
  push:
  pull_request:

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true # the trained models (*.pkl) are stored with Git LFS
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Unit tests
        run: pytest -q tests
      - name: Evaluation (offline regex baseline, no API key needed)
        run: python evals/run.py --provider rules --min-pass 0.85
      - name: Evaluation (Gemini, only if the GEMINI_API_KEY secret is set)
        if: ${{ env.GEMINI_API_KEY != '' }}
        env:
          LLM_FALLBACK_MODELS: ""
        run: python evals/run.py --provider gemini --model gemini-3.5-flash-lite --min-pass 0.85

  docker:
    runs-on: ubuntu-latest
    needs: test-and-eval
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - run: docker build -t diabetes-agent .
      - name: Smoke test the image
        run: |
          docker run -d -p 7860:7860 -e LLM_PROVIDER=rules --name app diabetes-agent
          for i in $(seq 1 30); do curl -fs localhost:7860/health && break; sleep 2; done
          curl -fs -X POST localhost:7860/chat -H 'Content-Type: application/json' \
            -d '{"message":"I am 45, sugar 160, BMI 29, insulin 120"}' | grep -q '"status":"result"'
